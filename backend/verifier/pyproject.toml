[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoax-verifier"
version = "0.1.0"
description = "Evidence-based verification engine (retrieval, relevance, stance, fuzzy aggregation) for the Smart News & Information Verifier"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
# Added in later steps (embedding relevance + NLI stance); not needed for evidence retrieval.
nlp = ["sentence-transformers>=3.0", "transformers>=4.44"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hoax_verifier*"]

[tool.setuptools.package-data]
hoax_verifier = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["tests"]
